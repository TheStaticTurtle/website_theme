<section id="section-newsletter" class="container markdown newsletter">
    <h2 id="newsletter">Newsletter<a class="header-link" href="#newsletter"><i class="mdi mdi-link-variant" aria-hidden="true"></i>Shortcut to: Newsletter</a></h2>
    <p>
        Want to stay updated with the latest posts and news? Subscribe to my newsletter!
    </p>
    
    <form target="_blank" method="post" action="https://notify.thestaticturtle.fr/subscription/form" class="listmonk-form">
        <input type="hidden" name="nonce" />
        <input type="hidden" name="l" value="0ae96e59-3a94-4c66-a9ed-9d19b61aaacb" />

        <div class="row">
            <div class="col">
                <label class="newsletter-form" for="news-email">E-Mail*:</label>
                <input id="news-email" type="email" name="email" required placeholder="E-mail" />
            </div>
            <div class="col">
                <label class="newsletter-form" for="news-name">Name:</label>
                <input id="news-name" type="text" name="name" placeholder="Name (optional)" />
            </div>
        </div>
        <div class="row">
            <div class="col newsletter-submit">
                <input type="submit" value="Subscribe " />
            </div>
        </div>
    </form>
</section>
